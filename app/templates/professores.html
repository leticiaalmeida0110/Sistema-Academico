
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Professores</title>
</head>
<body>
    <h1>Lista de Professores</h1>

    {% for item in dados %}
        <p>
            Nome: {{ item.nome }} |
            Especialidade: {{ item.especialidade }} |
            Email: {{ item.email }}
        </p>
    {% empty %}
        <p>Nenhum professor cadastrado.</p>
    {% endfor %}

    <a href="/">Voltar ao início</a>
</body>
</html>
